<script>

const FN=window.MD_SUPABASE_FUNCTION||'https://ydjsyvavthlkrlbktjkc.supabase.co/functions/v1/meerut-deals-gateway';
const APIKEY=window.MD_SUPABASE_PUBLISHABLE_KEY||'';
let ADMIN_KEY=sessionStorage.getItem('md_admin_key')||'';
const demoOrders=[{id:'MD-DEMO-1001',request_id:'MD-DEMO-1001',user_id:'demo',status:'PENDING',category:'Jewellery',item:'Gold Jewellery — Bridal Necklace',created_at:'2026-09-23T10:18:00Z',profile:{full_name:'Demo Customer',phone:'+91 98XXXXXX21',email:'demo.customer@example.com',location:'Meerut, U.P.',address:'Meerut, U.P.',gender:'Female',age:28},details:{Quantity:'32 g',Purity:'22K',Budget:'₹2,50,000',Requirement:'Bridal necklace set with premium finish. Traditional design preferred.',Extra:'Matching earrings and a comfortable lightweight finish requested.'},messages:[]},{id:'MD-DEMO-1002',request_id:'MD-DEMO-1002',user_id:'demo2',status:'CONTACTED',category:'House for Rent',item:'3 BHK House for Rent',created_at:'2026-09-23T09:42:00Z',profile:{full_name:'Demo Customer 2',phone:'+91 97XXXXXX44',email:'demo2@example.com',location:'Meerut, U.P.',address:'Meerut Cantt area, Meerut, U.P.',gender:'Male',age:34},details:{Budget:'₹25,000/month',Requirement:'3 BHK house, preferably furnished.',Extra:'Parking required.'},messages:[]},{id:'MD-DEMO-1003',request_id:'MD-DEMO-1003',user_id:'demo3',status:'COMPLETED',category:'Vehicles',item:'Second-Hand Car',created_at:'2026-09-22T18:10:00Z',profile:{full_name:'Demo Customer 3',phone:'+91 96XXXXXX18',email:'demo3@example.com',location:'Meerut, U.P.',address:'Meerut, U.P.',gender:'Male',age:31},details:{Budget:'₹6,00,000',Requirement:'Second-hand car, maximum 5 years old.',Extra:'Maximum running 60,000 km.'},messages:[]},{id:'MD-DEMO-1004',request_id:'MD-DEMO-1004',user_id:'demo4',status:'CANCELLED',category:'Furniture',item:'Sofa Set',created_at:'2026-09-22T15:30:00Z',profile:{full_name:'Demo Customer 4',phone:'+91 95XXXXXX76',email:'demo4@example.com',location:'Meerut, U.P.',address:'Meerut, U.P.',gender:'Female',age:26},details:{Budget:'₹45,000',Requirement:'Premium 5-seater sofa set.',Extra:'Neutral colour preferred.'},messages:[]}];
let orders=[];let filter='ALL';let activeChatId=null;let chatTimer=null;let live=true;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}
async function api(action,body={}){if(!ADMIN_KEY)throw new Error('Admin access required');try{const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':APIKEY,'x-md-admin-key':ADMIN_KEY},body:JSON.stringify({action,...body})});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j}catch(e){throw e}}
async function unlockAdmin(e){e.preventDefault();const input=document.getElementById('adminKeyInput');const err=document.getElementById('gateErr');const candidate=String(input.value||'').trim();if(!candidate)return;try{ADMIN_KEY=candidate;await api('admin_list_orders');sessionStorage.setItem('md_admin_key',candidate);document.getElementById('adminGate').remove();document.body.classList.remove('adminLocked');await loadLive();toast('Admin access granted')}catch(ex){ADMIN_KEY='';sessionStorage.removeItem('md_admin_key');err.textContent='Invalid admin access key or backend unavailable.';input.select()}}
function lockAdmin(){sessionStorage.removeItem('md_admin_key');ADMIN_KEY='';location.reload()}
function statusClass(s){s=String(s||'').toUpperCase();return s==='PENDING'?'pending':s==='CONTACTED'?'contacted':s==='COMPLETED'?'completed':'cancelled'}function statusLabel(s){s=String(s||'');return s.charAt(0)+s.slice(1).toLowerCase()}
function normalize(o){return {...o,customer:o.profile?.full_name||o.details?.Customer_Name||'Customer',profile:o.profile||{},details:o.details||{},messages:o.messages||[]}}
async function loadLive(){try{const r=await api('admin_list_orders');orders=(r.orders||[]).map(normalize);live=true;render();return true}catch(e){live=false;orders=[];render();toast('Live backend unavailable — retrying')}return false}
async function setStatus(id,status){const o=orders.find(x=>x.id===id);if(!o)return;try{await api('admin_update_order',{id,status});o.status=status;render();if(activeChatId===id)inspect(id);toast('Status updated successfully')}catch(e){toast(e.message||'Unable to update status')}}
async function adminDelete(id){if(!confirm('Delete this order from Admin Panel?'))return;try{await api('admin_delete_order',{id});orders=orders.filter(x=>x.id!==id);closeInspect();closeChat();render();toast('Order deleted by admin')}catch(e){toast(e.message||'Unable to delete order')}}
function detailEntries(o){const d=o.details||{};const skip=new Set(['Customer_Name','Customer_Phone','Customer_Email','Customer_Address','Customer_Location','Customer_Gender','Customer_Age','Request ID','Sync Token']);return Object.entries(d).filter(([k,v])=>!skip.has(k)&&v!==''&&v!==null&&v!==undefined).map(([k,v])=>`<b>${esc(k.replaceAll('_',' '))}</b><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span>`).join('')}
function inspect(id){const o=orders.find(x=>x.id===id);if(!o)return;const p=o.profile||{},d=o.details||{};const s=document.getElementById('inspectScreen');s.innerHTML=`<div class="screenInner"><div class="screenHead"><button class="back" onclick="closeInspect()">← Back</button><span class="badge ${statusClass(o.status)}">${esc(statusLabel(o.status))}</span></div><section class="inspectHero"><div class="small">Full order inspection</div><h2>${esc(o.request_id||o.id)}</h2><p>${esc(o.item||'Requirement')} • ${esc(o.customer)}</p></section><div class="detailGrid"><section class="detailBox"><div class="detailTitle">Customer Profile</div><div class="kv"><b>Name</b><span>${esc(p.full_name||d.Customer_Name||o.customer)}</span><b>Phone</b><span>${esc(p.phone||d.Customer_Phone||'Not provided')}</span><b>Email</b><span>${esc(p.email||d.Customer_Email||'Not provided')}</span><b>Location</b><span>${esc(p.location||d.Customer_Location||'Not provided')}</span><b>Address</b><span>${esc(p.address||d.Customer_Address||'Not provided')}</span><b>Gender</b><span>${esc(p.gender||d.Customer_Gender||'Not provided')}</span><b>Age</b><span>${esc(p.age||d.Customer_Age||'Not provided')}</span></div></section><section class="detailBox"><div class="detailTitle">Order Summary</div><div class="kv"><b>Order No.</b><span>${esc(o.request_id||o.id)}</span><b>Category</b><span>${esc(o.category||d.Category||'Not specified')}</span><b>Item</b><span>${esc(o.item||d.Item||'Not specified')}</span><b>Submitted</b><span>${o.created_at?esc(new Date(o.created_at).toLocaleString()):'—'}</span><b>Backend Status</b><span>${esc(statusLabel(o.status))}</span></div></section><section class="detailBox full"><div class="detailTitle">Everything Customer Submitted</div><div class="kv">${detailEntries(o)||'<span>No additional structured details.</span>'}</div></section><section class="detailBox full"><div class="detailTitle">Order Actions</div><div class="statusPanel"><select class="statusSelect" onchange="setStatus('${o.id}',this.value)"><option value="PENDING" ${o.status==='PENDING'?'selected':''}>Pending</option><option value="CONTACTED" ${o.status==='CONTACTED'?'selected':''}>Contacted</option><option value="COMPLETED" ${o.status==='COMPLETED'?'selected':''}>Completed</option><option value="CANCELLED" ${o.status==='CANCELLED'?'selected':''}>Cancelled</option></select><button class="chatBtn" onclick="openChat('${o.id}')">💬 Chat with Customer</button></div></section><section class="deleteRow full"><div class="rule"><b>Admin delete:</b> Admin can delete this order at any status, including Completed or Cancelled.</div><button class="btn danger" onclick="adminDelete('${o.id}')">Delete Order</button></section></div></div>`;s.classList.remove('hidden');document.body.style.overflow='hidden'}
function closeInspect(){document.getElementById('inspectScreen').classList.add('hidden');document.getElementById('inspectScreen').innerHTML='';if(document.getElementById('chatScreen').classList.contains('hidden'))document.body.style.overflow=''}
function openChat(id){const o=orders.find(x=>x.id===id);if(!o)return;activeChatId=id;const c=document.getElementById('chatScreen');c.innerHTML=`<div class="chatHead"><button class="back" onclick="closeChat()">←</button><div class="chatTitle"><b>Chat with ${esc(o.customer)}</b><span>${esc(o.request_id||o.id)} • ${esc(o.item)}</span></div></div><div class="chatBody" id="chatBody"><div class="muted">Loading chat…</div></div><form class="chatComposer" onsubmit="sendChat(event)"><textarea id="chatInput" class="chatInput" rows="1" placeholder="Write a message…" autocomplete="off"></textarea><button class="sendBtn" type="submit">Send</button></form>`;c.classList.remove('hidden');document.body.style.overflow='hidden';loadChat();clearInterval(chatTimer);chatTimer=setInterval(loadChat,1800)}
async function loadChat(){if(!activeChatId)return;const box=document.getElementById('chatBody');if(!box)return;try{const r=await api('admin_messages',{orderId:activeChatId});const msgs=r.messages||[];box.innerHTML=msgs.length?msgs.map(m=>`<div class="msg ${m.sender_role==='admin'?'admin':'customer'}">${esc(m.message||m.body||'')}<span class="msgTime">${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span></div>`).join(''):'<div class="muted" style="margin:auto">No messages yet. Start the conversation.</div>';box.scrollTop=box.scrollHeight}catch(e){box.innerHTML='<div class="muted">Chat temporarily unavailable.</div>'}}
function closeChat(){clearInterval(chatTimer);chatTimer=null;document.getElementById('chatScreen').classList.add('hidden');document.getElementById('chatScreen').innerHTML='';activeChatId=null;if(document.getElementById('inspectScreen').classList.contains('hidden'))document.body.style.overflow=''}
async function sendChat(e){e.preventDefault();const input=document.getElementById('chatInput');const text=(input?.value||'').trim();if(!text||!activeChatId)return;input.value='';try{await api('admin_send_message',{orderId:activeChatId,message:text});await loadChat();toast('Message sent')}catch(err){input.value=text;toast(err.message||'Unable to send message')}}
function card(o){const jewel=String(o.category||'').toLowerCase().includes('jewellery')||String(o.item||'').toLowerCase().includes('jewellery');return `<article class="card ${jewel?'jewel':''}">${jewel?'<div class="priority">◆ PRIORITY JEWELLERY</div>':''}<div class="cardTop"><div><div class="orderNo">${esc(o.request_id||o.id)}</div><div class="customerName">${esc(o.customer)}</div></div><span class="badge ${statusClass(o.status)}">${esc(statusLabel(o.status))}</span></div><div class="cardActions"><button class="inspect" onclick="inspect('${o.id}')">Inspect Order</button><select class="statusQuick" aria-label="Update status" onchange="setStatus('${o.id}',this.value)"><option value="PENDING" ${o.status==='PENDING'?'selected':''}>Pending</option><option value="CONTACTED" ${o.status==='CONTACTED'?'selected':''}>Contacted</option><option value="COMPLETED" ${o.status==='COMPLETED'?'selected':''}>Completed</option><option value="CANCELLED" ${o.status==='CANCELLED'?'selected':''}>Cancelled</option></select></div><div class="touchHint">Only order number, customer name and status are shown here.</div></article>`}
function render(){const visible=filter==='ALL'?orders:orders.filter(o=>String(o.status).toUpperCase()===filter);const counts={PENDING:orders.filter(o=>o.status==='PENDING').length,CONTACTED:orders.filter(o=>o.status==='CONTACTED').length,COMPLETED:orders.filter(o=>o.status==='COMPLETED').length,CANCELLED:orders.filter(o=>o.status==='CANCELLED').length};document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><div class="brandMark"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="101" fill="#fff" stroke="#111827" stroke-width="7"/><path d="M48 145V78l62 53 62-53v67" fill="none" stroke="#111827" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M79 78V58q0-16 16-16h30q16 0 16 16v20" fill="none" stroke="#111827" stroke-width="10" stroke-linecap="round"/><path d="M151 126h31l10 17h-41z" fill="#7c3aed"/><circle cx="159" cy="153" r="7" fill="#7c3aed"/><circle cx="184" cy="153" r="7" fill="#7c3aed"/><text x="110" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="900" letter-spacing="3" fill="#111827">MEERUT</text><text x="110" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#7c3aed">DEALS</text></svg></div><div><h1>Meerut Deals Admin</h1><div class="muted">Admin Panel V7 • ${live?'Live Backend':'Demo Fallback'}</div></div></div><div class="actions"><button class="btn gold" onclick="loadLive()">↻ Refresh</button></div></header><section class="hero"><div class="heroRow"><div><h2>Admin Control Center</h2><p>Manage real requests, inspect complete profiles and chat with customers.</p></div><span class="heroPill">${live?'SUPABASE LIVE':'DEMO'}</span></div></section><section class="stats"><div class="stat"><b>${orders.length}</b><span>Total Orders</span></div><div class="stat"><b>${counts.PENDING}</b><span>Pending</span></div><div class="stat"><b>${counts.CONTACTED}</b><span>Contacted</span></div><div class="stat"><b>${counts.COMPLETED}</b><span>Completed</span></div><div class="stat"><b>${counts.CANCELLED}</b><span>Cancelled</span></div></section><nav class="filters">${['ALL','PENDING','CONTACTED','COMPLETED','CANCELLED'].map(f=>`<button class="filter ${filter===f?'active':''}" onclick="filter='${f}';render()">${f==='ALL'?'All Orders':statusLabel(f)}</button>`).join('')}</nav><main class="grid">${visible.length?visible.map(card).join(''):'<div class="empty">No orders in this filter.</div>'}</main>`}
async function boot(){document.body.classList.add('adminLocked');const gate=document.getElementById('adminGate');const saved=sessionStorage.getItem('md_admin_key');if(saved){ADMIN_KEY=saved;try{await api('admin_list_orders');gate.remove();document.body.classList.remove('adminLocked')}catch(e){ADMIN_KEY='';sessionStorage.removeItem('md_admin_key')}}if(document.getElementById('adminGate'))return;render();setTimeout(async()=>{const ok=await loadLive();if(ok)toast('Live backend connected');const l=document.getElementById('loader');l.style.opacity='0';l.style.visibility='hidden';setTimeout(()=>l.remove(),280)},1800);setInterval(()=>{if(document.querySelector('.screen:not(.hidden)')||activeChatId)return;loadLive()},5000)}boot();

</script>
</body></html>
